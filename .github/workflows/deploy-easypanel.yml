name: Deploy automático no EasyPanel

on:
  workflow_run:
    workflows: ["Publicar imagem Docker (GHCR)"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: easypanel-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuração do EasyPanel
        id: easypanel
        env:
          EASYPANEL_DEPLOY_TRIGGER_URL: ${{ secrets.EASYPANEL_DEPLOY_TRIGGER_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EASYPANEL_DEPLOY_TRIGGER_URL}" ]; then
            echo "::warning::Secret EASYPANEL_DEPLOY_TRIGGER_URL ainda não configurado; deploy automático ignorado."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Disparar implantação no EasyPanel
        if: steps.easypanel.outputs.configured == 'true'
        env:
          EASYPANEL_DEPLOY_TRIGGER_URL: ${{ secrets.EASYPANEL_DEPLOY_TRIGGER_URL }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             --request POST             --header "Content-Type: application/json"             --data '{"source":"github-actions","repository":"${{ github.repository }}","sha":"${{ github.event.workflow_run.head_sha || github.sha }}"}'             "${EASYPANEL_DEPLOY_TRIGGER_URL}"

      - name: Registrar conclusão
        if: steps.easypanel.outputs.configured == 'true'
        run: echo "EasyPanel acionado para implantar a imagem publicada da main."
